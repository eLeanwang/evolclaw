[project]
name = "aun-cli"
version = "0.1.0"
description = "AUN CLI - Interactive command-line client for AUN protocol"
requires-python = ">=3.10"
dependencies = [
    "aun-core>=0.1.5",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
aun = "aun_cli:cli_main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["aun_cli"]
