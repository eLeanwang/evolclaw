<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvolClaw Watch</title>
  <link rel="icon" href="data:,">
  <script>
    (function () {
      var pref = localStorage.getItem('ecTheme') || 'light';
      if (pref === 'auto') pref = 'system';
      if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'light';
      var theme = pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : (pref === 'dark' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-theme-pref', pref);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <!-- 配对页 -->
  <div id="pair-page" class="pair-page">
    <div class="pair-box">
      <h1 data-i18n="pair.title">🔭 EvolClaw Watch</h1>
      <p class="pair-hint" data-i18n="pair.hint">输入终端显示的 6 位配对码</p>
      <input id="pair-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" data-i18n="pair.placeholder" autocomplete="off">
      <button id="pair-btn" data-i18n="action.pair">配对</button>
      <div id="pair-error" class="pair-error"></div>
    </div>
  </div>

  <!-- 主面板 -->
  <div id="app" class="app" style="display:none">
    <header class="topbar">
      <span class="brand">🔭 EvolClaw Watch</span>
      <nav class="tabs">
        <button class="tab active" data-view="agents" data-i18n="tab.agents">Agents</button>
        <button class="tab" data-view="msg" data-i18n="tab.messages">Messages</button>
        <button class="tab" data-view="session" data-i18n="tab.sessions">Sessions</button>
        <button class="tab" data-view="triggers" data-i18n="tab.triggers">Triggers</button>
        <button class="tab" data-view="cache" data-i18n="tab.cache">Cache</button>
        <button class="tab" data-view="system" data-i18n="tab.system">System</button>
        <button class="tab" data-view="gateway" data-i18n="tab.gateway">API Endpoints</button>
        <button class="tab" data-view="usage" data-i18n="tab.usage">Usage</button>
        <button class="tab" data-view="monitor" data-i18n="tab.monitor">Monitor</button>
        <button class="tab" data-view="roleDefinitions" data-i18n="tab.roleDefinitions">Roles</button>
        <button class="tab" data-view="roles" data-i18n="tab.roles">Role Assignment</button>

      </nav>
      <span style="flex:1"></span>
      <span class="build-ts" style="font-size:10px;color:var(--dim)" data-i18n-title="common.buildTime" title="构建时间">2026-06-07 21:55</span>
      <span id="conn-status" class="conn-status" data-i18n="status.connecting">连接中…</span>
      <button id="lang-btn" class="theme-btn" data-i18n-title="language.buttonTitle" title="切换语言">🌐</button>
      <button id="theme-btn" class="theme-btn" data-i18n-title="theme.buttonTitle" title="主题">🌗</button>
      <button id="logout-btn" class="logout-btn" data-i18n="action.logout" data-i18n-title="pair.logoutTitle" title="退出配对">退出</button>
    </header>

    <main class="content">
      <section id="view-agents" class="view active"></section>
      <section id="view-msg" class="view">
        <div class="msg-layout">
          <div id="msg-aids" class="msg-col msg-aids"></div>
          <div id="msg-peers" class="msg-col msg-peers"></div>
          <div id="msg-stream" class="msg-col msg-stream"></div>
        </div>
      </section>
      <section id="view-session" class="view">
        <div class="sess-layout">
          <div id="sess-list" class="sess-col sess-list"></div>
          <div id="sess-detail" class="sess-col sess-detail"></div>
        </div>
      </section>
      <section id="view-triggers" class="view">
        <div class="trig-layout">
          <div id="trig-agents" class="msg-col trig-agents-col"></div>
          <div id="trig-table" class="trig-table-col"></div>
        </div>
      </section>
      <section id="view-cache" class="view"></section>
      <section id="view-system" class="view"></section>
      <section id="view-gateway" class="view"></section>
      <section id="view-usage" class="view">
        <div class="usage-layout">
          <!-- 子 Tab：Overview / Explorer -->
          <div class="usage-subtabs">
            <button class="usage-subtab active" data-subview="overview" data-i18n="usage.subtab.overview">Overview</button>
            <button class="usage-subtab" data-subview="explorer" data-i18n="usage.subtab.explorer">Explorer</button>
          </div>

          <!-- Overview 面板 -->
          <div id="usage-overview" class="usage-subpanel active">
            <div class="overview-filters">
              <div class="ov-range-tabs">
                <button class="ov-range-btn active" data-range="today" data-i18n="usage.overview.range.today">Today</button>
                <button class="ov-range-btn" data-range="week" data-i18n="usage.overview.range.week">This Week</button>
                <button class="ov-range-btn" data-range="lastWeek" data-i18n="usage.overview.range.lastWeek">Last Week</button>
                <button class="ov-range-btn" data-range="month" data-i18n="usage.overview.range.month">This Month</button>
                <button class="ov-range-btn" data-range="last30" data-i18n="usage.overview.range.last30">Last 30 Days</button>
                <button class="ov-range-btn" data-range="custom" data-i18n="usage.overview.range.custom">Custom</button>
              </div>
              <div class="ov-custom-date" id="ov-custom-date" style="display:none;">
                <label><span data-i18n="usage.explorer.filter.from">From</span> <input type="datetime-local" id="ov-from"></label>
                <label><span data-i18n="usage.explorer.filter.to">To</span> <input type="datetime-local" id="ov-to"></label>
                <button id="ov-query-btn" data-i18n="action.query">Query</button>
              </div>
            </div>
            <div id="ov-cards" class="usage-cards"></div>
            <div class="usage-table-section" style="margin-top:4px">
              <h3 id="ov-table-title" data-i18n="usage.overview.title">Summary by Agent</h3>
              <table id="ov-agent-table" class="usage-table"></table>
            </div>

            <!-- 模型访问明细查询 -->
            <div class="usage-table-section" style="margin-top:16px">
              <h3 data-i18n="usage.detail.title">Model Access Details</h3>
              <div class="detail-filters">
                <label><span data-i18n="usage.detail.agent">Agent</span>
                  <select id="detail-agent">
                    <option value="" data-i18n="usage.explorer.all">All</option>
                  </select>
                </label>
                <label><span data-i18n="usage.detail.model">Model</span>
                  <select id="detail-model">
                    <option value="" data-i18n="usage.explorer.all">All</option>
                  </select>
                </label>
                <label><span data-i18n="usage.detail.pageSize">Per page</span>
                  <select id="detail-page-size">
                    <option value="20">20</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                  </select>
                </label>
              </div>
              <div id="detail-result" style="margin-top:12px;max-height:400px;overflow-y:auto;">
                <table id="detail-table" class="usage-table"></table>
              </div>
              <div class="detail-pagination">
                <button id="detail-prev-page" data-i18n="usage.detail.prevPage">Previous</button>
                <input type="number" id="detail-page" value="1" min="1" style="width:60px;text-align:center">
                <button id="detail-next-page" data-i18n="usage.detail.nextPage">Next</button>
                <span id="detail-pagination-info" style="margin-left:12px;color:var(--dim);font-size:12px"></span>
              </div>
            </div>
          </div>

          <!-- Explorer 面板 -->
          <div id="usage-explorer" class="usage-subpanel">
            <div class="exp-layout">
              <!-- 左侧列表 -->
              <div class="exp-sidebar">
                <div class="exp-sidebar-group">
                  <div class="exp-sidebar-title" data-i18n="usage.explorer.sidebar.agents">Agents</div>
                  <div id="exp-agent-list"></div>
                </div>
                <div class="exp-sidebar-group">
                  <div class="exp-sidebar-title" data-i18n="usage.explorer.sidebar.peers">Peers</div>
                  <div id="exp-peer-list"></div>
                </div>
              </div>
              <!-- 右侧详情 -->
              <div class="exp-detail">
                <div id="exp-detail-header" class="exp-detail-header">
                  <span id="exp-selected-name" data-i18n="usage.explorer.selectHint">Select an Agent or Peer from the left</span>
                </div>

                <!-- 时间范围选择（与总览类似，但支持精确到时分秒） -->
                <div class="exp-time-filters">
                  <div class="exp-range-tabs">
                    <button class="exp-range-btn active" data-range="today" data-i18n="usage.overview.range.today">Today</button>
                    <button class="exp-range-btn" data-range="week" data-i18n="usage.overview.range.week">This Week</button>
                    <button class="exp-range-btn" data-range="lastWeek" data-i18n="usage.overview.range.lastWeek">Last Week</button>
                    <button class="exp-range-btn" data-range="month" data-i18n="usage.overview.range.month">This Month</button>
                    <button class="exp-range-btn" data-range="last30" data-i18n="usage.overview.range.last30">Last 30 Days</button>
                    <button class="exp-range-btn" data-range="custom" data-i18n="usage.overview.range.custom">Custom</button>
                  </div>
                  <div class="exp-custom-date" id="exp-custom-date" style="display:none;">
                    <label><span data-i18n="usage.explorer.filter.from">From</span> <input type="datetime-local" id="exp-from"></label>
                    <label><span data-i18n="usage.explorer.filter.to">To</span> <input type="datetime-local" id="exp-to"></label>
                    <button id="exp-time-query-btn" data-i18n="action.query">Query</button>
                  </div>
                </div>

                <div id="exp-detail-cards" class="usage-cards"></div>

                <!-- 模型和粒度筛选 -->
                <div class="explorer-filters">
                  <label>
                    <span data-i18n="usage.explorer.filter.model">Model</span>
                    <select id="exp-model">
                      <option value="" data-i18n="usage.explorer.all">All</option>
                    </select>
                  </label>
                  <label>
                    <span data-i18n="usage.explorer.filter.granularity">Granularity</span>
                    <select id="exp-granularity">
                      <option value="hour" data-i18n="usage.explorer.filter.granularity.hour">Hour</option>
                      <option value="day" selected data-i18n="usage.explorer.filter.granularity.day">Day</option>
                      <option value="week" data-i18n="usage.explorer.filter.granularity.week">Week</option>
                      <option value="month" data-i18n="usage.explorer.filter.granularity.month">Month</option>
                    </select>
                  </label>
                  <button id="exp-query-btn" data-i18n="action.query">Query</button>
                </div>

                <div id="usage-explorer-chart" class="usage-chart" style="height:260px"></div>
                <div class="usage-table-section" style="margin-top:12px">
                  <h3 data-i18n="usage.explorer.results">Results</h3>
                  <table id="usage-explorer-table" class="usage-table"></table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-monitor" class="view">
        <div class="mon-layout">
          <div class="mon-toolbar">
            <span class="mon-toolbar-label" data-i18n="monitor.toolbar.timeRange">时间范围</span>
            <div class="mon-range-tabs">
              <button class="mon-range active" data-range="2m" data-i18n="monitor.range.2m">2 分钟</button>
              <button class="mon-range" data-range="10m" data-i18n="monitor.range.10m">10 分钟</button>
              <button class="mon-range" data-range="1h" data-i18n="monitor.range.1h">1 小时</button>
            </div>
            <span style="flex:1"></span>
            <span class="mon-legend">
              <span class="mon-legend-item"><i class="lg-dot lg-proc"></i><span data-i18n="monitor.legend.process">evolclaw 进程</span></span>
              <span class="mon-legend-item"><i class="lg-dot lg-sys"></i><span data-i18n="monitor.legend.system">整机系统</span></span>
            </span>
          </div>
          <div id="mon-cards" class="usage-cards"></div>
          <div class="mon-row2">
            <div id="mon-cpu-chart" class="mon-chart"></div>
            <div id="mon-mem-chart" class="mon-chart"></div>
          </div>
          <div class="mon-row2">
            <div id="mon-msg-chart" class="mon-chart"></div>
            <div id="mon-err-chart" class="mon-chart"></div>
          </div>
          <div class="mon-table-wrap" id="mon-agent-table-wrap"></div>
          <div class="mon-err-wrap" id="mon-err-list"></div>
        </div>
      </section>

      <!-- 角色定义管理页面 -->
      <section id="view-roleDefinitions" class="view">
        <div class="role-defs-layout">
          <div class="role-defs-header">
            <h2 data-i18n="roleDefs.title">角色定义管理</h2>
            <button class="btn-new-role" id="btn-new-role">+ 新增角色</button>
          </div>

          <!-- 全局默认角色选择器 -->
          <div class="role-default-selector" id="role-default-selector">
            <label class="role-default-label">
              <span>默认角色 (Default Role):</span>
              <select id="default-private-role-select" class="form-select">
                <!-- 动态填充 -->
              </select>
            </label>
            <small style="color: var(--dim);">未显式分配角色的用户将使用此角色</small>
          </div>

          <div class="role-cards-grid" id="role-cards-grid">
            <!-- 动态渲染角色卡片 -->
          </div>
        </div>

        <!-- 角色编辑弹窗 -->
        <div id="role-edit-modal" class="modal" style="display:none">
          <div class="modal-content">
            <div class="modal-header">
              <h3 id="role-edit-title">编辑角色</h3>
              <button class="modal-close" id="role-edit-close">×</button>
            </div>
            <div class="modal-body" id="role-edit-body">
              <!-- 动态渲染表单 -->
            </div>
            <div class="modal-footer">
              <button class="btn-secondary" id="role-edit-cancel" data-i18n="roleDefs.cancel">取消</button>
              <button class="btn-primary" id="role-edit-save" data-i18n="roleDefs.save">保存</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 角色分配管理页面 -->
      <section id="view-roles" class="view">
        <div class="role-assign-layout">
          <!-- Agent 选择器 + 搜索 + 筛选 -->
          <div class="assign-header">
            <label>
              <span data-i18n="roles.selectAgent">Select Agent:</span>
              <select id="roles-agent-select">
                <option value="" data-i18n="roles.selectAgentPlaceholder">-- Select an Agent --</option>
              </select>
            </label>
            <select id="filter-chattype">
              <option value="" data-i18n="roles.filter.allChatType">全部会话</option>
              <option value="private" data-i18n="roles.filter.private">💬 私聊</option>
              <option value="group" data-i18n="roles.filter.group">👥 群聊</option>
            </select>
            <select id="filter-verify">
              <option value="" data-i18n="roles.filter.allVerify">全部状态</option>
              <option value="verified" data-i18n="roles.filter.verified">✅ 已验证</option>
              <option value="invalid" data-i18n="roles.filter.invalid">⚠️ 验证失败</option>
              <option value="agentmd-unverified" data-i18n="roles.filter.unverified">⚠️ 未验证</option>
              <option value="unknown" data-i18n="roles.filter.unknown">❓ 未知</option>
            </select>
            <div class="search-box">
              <input type="search" id="peer-search" placeholder="Search peer key..." data-i18n="roles.searchPlaceholder">
            </div>
          </div>

          <!-- 对端关系列表 -->
          <div class="assign-peer-roles">
            <table id="relations-table" class="relations-table">
              <thead>
                <tr>
                  <th data-i18n="roles.table.chatType">会话</th>
                  <th data-i18n="roles.table.peerName">昵称</th>
                  <th data-i18n="roles.table.peerAid">对端AID</th>
                  <th data-i18n="roles.table.peerType">类型</th>
                  <th data-i18n="roles.table.role">角色</th>
                  <th data-i18n="roles.table.source">来源</th>
                  <th data-i18n="roles.table.actions">操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 对端角色编辑弹窗 -->
        <div id="peer-role-modal" class="modal" style="display:none">
          <div class="modal-content">
            <div class="modal-header">
              <h3 id="peer-role-title">Edit Peer Role</h3>
              <button class="modal-close" id="peer-role-close">×</button>
            </div>
            <div class="modal-body" id="peer-role-body">
              <!-- 动态渲染 -->
            </div>
            <div class="modal-footer">
              <button class="btn-secondary" id="peer-role-cancel" data-i18n="roleDefs.cancel">Cancel</button>
              <button class="btn-primary" id="peer-role-save" data-i18n="roleDefs.save">Save</button>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
